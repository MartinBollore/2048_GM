[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gm2048"
version = "0.1.0"
description = "Moteur de jeu 2048 et IA capable d'y jouer mieux qu'un bon joueur."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "typer>=0.12",
]

[project.optional-dependencies]
gui = [
    "pygame-ce>=2.5",
]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "pygame-ce>=2.5",
]

[project.scripts]
gm2048 = "gm2048.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
